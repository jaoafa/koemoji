name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - run: python3 -m unittest discover -s updater/tests
      - run: scripts/install-sherpa.sh
      # PipelineTest と UserPipelineTest は、data/models のモデルと音声入りの wav が必要なので、ここではスキップされる。
      # CtcConfidenceTest はモデルを取得して必ず実行する。sherpa-onnx の更新で確信度のパッチが壊れたら、ここで失敗する。
      - run: mvn -B verify
        env:
          REQUIRE_MODEL_TESTS: "1"
